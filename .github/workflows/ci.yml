name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependências
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Testes
        run: uv run pytest
