[project]
name = "pi5"
version = "0.2.0"
description = "ELT sobre o Backblaze Drive Stats: extração do Iceberg público e carga no ADLS Gen2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.19",
    "azure-storage-file-datalake>=12.18",
    "duckdb>=1.4",
    "filelock>=3.16",
]

[project.scripts]
etl = "pi5.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Textos e comentários em português usam travessão e aspas tipográficas.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
